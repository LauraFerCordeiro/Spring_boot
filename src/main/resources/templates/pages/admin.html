<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/adm_dash}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Curso</title>
</head>

<body>
    <div layout:fragment="corpo" class="bg-zinc-800 w-full overflow-auto">
        <div class="grid grid-cols-3 gap-6 p-6 bg-zinc-800 min-h-screen">
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Empresas</h3>
                <a th:href="@{/companies/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/companies/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Funcionários</h3>
                <a th:href="@{/workers/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/workers/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Departamentos</h3>
                <a th:href="@{/departments/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/departments/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Cursos</h3>
                <a th:href="@{/courses/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/courses/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Aulas</h3>
                <a th:href="@{/lessons/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/lessons/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
            <div class="bg-zinc-700 rounded shadow-md p-6">
                <h3 class="text-2xl font-bold text-purple-400 mb-4">Pessoas</h3>
                <a th:href="@{/people/cadastrar}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 mb-2 text-center">Cadastrar</a>
                <a th:href="@{/people/lista}" class="block bg-purple-500 hover:bg-purple-600 text-white rounded p-2 text-center">Listar</a>
            </div>
        </div>
        
    </div>
</body>

</html>
