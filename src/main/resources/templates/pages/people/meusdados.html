<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/people}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Cliente</title>
    <link rel="stylesheet" href="../css/person.css">
</head>

<body>
    <div layout:fragment="corpo">
        <h2 class="text-2xl font-bold mb-4">Meus dados</h2>
        <table class="w-full text-white border-collapse">
            <tr class="border-b border-zinc-700">
                <th class="px-4 py-2 text-left">Nome:</th>
                <td th:text="${people.name}" class="px-4 py-2">Fulano de Tal</td>
            </tr>
            <tr class="border-b border-zinc-700">
                <th class="px-4 py-2 text-left">Data de Nascimento:</th>
                <td th:text="${people.birthDate}" class="px-4 py-2">01/01/2000</td>
            </tr>
            <tr class="border-b border-zinc-700">
                <th class="px-4 py-2 text-left">CPF:</th>
                <td th:text="${people.cpf}" class="px-4 py-2">000.000.000-00</td>
            </tr>
            <tr class="border-b border-zinc-700">
                <th class="px-4 py-2 text-left">Telefone:</th>
                <td th:text="${people.telephone}" class="px-4 py-2">(00) 00000-0000</td>
            </tr>
            <tr class="border-b border-zinc-700">
                <th class="px-4 py-2 text-left">Endereço:</th>
                <td th:text="${people.address}" class="px-4 py-2">Rua Exemplo, 123</td>
            </tr>
            <tr>
                <td colspan="2" class="pt-4">
                    <a th:href="@{/people/editarPessoa/{id} (id=${people.id})}" role="button" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-md inline-block">Editar</a>
                </td>
            </tr>
        </table>
    </div>
    
</body>

</html>
