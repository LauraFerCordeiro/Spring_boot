<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/people}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 font-sans">
    <div layout:fragment="corpo" class="container mx-auto p-6">
        <header class="mb-8">
            <h2 class="text-4xl font-bold text-white">Aulas disponiveis</h2>
            <p class="text-lg mt-2">Aqui você pode ver as aulas que já estão disponiveis no seu curso</p>
        </header>

        <section class="mb-8">
            <h3 class="text-xl font-semibold text-white mb-4">Aulas disponiveis ➔</h3>
            <div class="bg-zinc-800 rounded-lg p-4 shadow-md">
                <p class="text-gray-400 pb-3">Aulas disponiveis estarão aqui :)</p>
                <div class="flex flex-nowrap">
                    <div th:each="lesson : ${lessons}" class="min-w-[250px] bg-zinc-800 border border-gray-700 rounded-lg shadow-lg p-4 hover:shadow-2xl transition-shadow duration-300">
                        <h4 class="text-lg font-semibold text-white" th:text="${lesson.name}">Nome do Curso</h4>
                        <p class="text-gray-400 mb-3">Aula <span th:text="${lesson.lessonNumber}">x</span></p>
                        <a class="text-purple-400 underline hover:text-blue-500 transition duration-200"
                            th:href="@{/courses/lesson/{id}(id=${lesson.id})}">
                            Ver aula
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
